
name: MASRAINMAN Cyclone Tracker

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, starting at midnight IST
    - cron: "30 18,21,0,3,6,9,12,15 * * *"

permissions:
  contents: write

concurrency:
  group: cyclone-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libproj-dev proj-data proj-bin libgeos-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cyclone tracker
        env:
          ECMWF_MODELS: ${{ vars.ECMWF_MODELS }}
          WEATHERNEXT_EXPORT_URL: ${{ vars.WEATHERNEXT_EXPORT_URL }}
          WEATHERNEXT_EXPORT_TOKEN: ${{ secrets.WEATHERNEXT_EXPORT_TOKEN }}
        run: python scripts/cyclone_tracker.py

      - name: Commit dashboard outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.png docs/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cyclone dashboard"
            git push
          fi
